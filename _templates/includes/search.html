<button class="btn" type="button" data-bs-toggle="modal" data-bs-target="#search">
  <i class="bi bi-search"></i>
</button>
<div class="modal fade" id="search" tabindex="-1" aria-labelledby="search-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content">
      <div class="modal-header visually-hidden">
        <h2 class="modal-title" id="search-label">Search</h2>
      </div>
      <div class="modal-body">
        <pagefind-config bundle-path="{{ '/search/' | url }}"></pagefind-config>
        <pagefind-input placeholder="Search..." autofocus></pagefind-input>
        <pagefind-results></pagefind-results>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
