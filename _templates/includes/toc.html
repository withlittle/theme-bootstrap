<ul class="nav flex-column">
  {% for item in page.toc recursive %}
    <li class="nav-item">
      <a class="nav-link" href="{{ item.url | safe }}">{{ item.title }}</a>
      {% if item.children %}
        <ul class="nav flex-column">
          {{ loop(item.children) }}
        </ul>
      {% endif %}
    </li>
  {% endfor %}
  <li class="nav-item">
    <hr>
  </li>
  <li class="nav-item">
    <a class="nav-link" href="#top">Back to top</a>
  </li>
</ul>
